[tool.poetry]
name = "strafwecker-backend"
version = "0.1.0"
description = "Strafwecker alarm system backend"
authors = ["mrlmueller"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.29"}
pydantic-settings = "^2.2"
python-dotenv = "^1.0"
orjson = "^3.10"
requests = "^2.31"
tinytuya = "^1.15"
alembic = "^1.13"
pygame = ">=2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
httpx = "^0.27"
ruff = "^0.4"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
