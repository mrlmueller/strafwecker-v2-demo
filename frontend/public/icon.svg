<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sunriseGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9FD4B5"/>
      <stop offset="100%" stop-color="#F0E8D8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="68%" r="55%">
      <stop offset="0%" stop-color="#9FD4B5" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#9FD4B5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9FD4B5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Charcoal background -->
  <rect width="512" height="512" fill="#161616"/>

  <!-- Soft halo behind/above the sun (anchors the dark sky) -->
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- Half-sun rising from the horizon — larger, raised slightly -->
  <path d="M 100 348 A 156 156 0 0 1 412 348 Z" fill="url(#sunriseGrad)"/>

  <!-- Horizon line -->
  <line x1="56" y1="362" x2="456" y2="362" stroke="#F0E8D8" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

  <!-- Ground tick marks below the horizon -->
  <line x1="86" y1="430" x2="156" y2="430" stroke="#9FD4B5" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
  <line x1="200" y1="430" x2="312" y2="430" stroke="#9FD4B5" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
  <line x1="356" y1="430" x2="426" y2="430" stroke="#9FD4B5" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
</svg>
